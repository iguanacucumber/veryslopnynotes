<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="veryslopnynotes">
  <title>veryslopnynotes</title>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="page">
      <rect x="140" y="92" width="232" height="328" rx="42"/>
    </clipPath>
  </defs>
  <style>
    .lueur { animation: lueur 3.6s ease-in-out infinite; }
