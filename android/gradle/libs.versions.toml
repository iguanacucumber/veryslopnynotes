# Dépendances Gradle versionnées (issue #13, ADR-001).
# Catalogue seul : versions figées, licences MIT-compatibles.
[versions]
agp = "8.5.2"
kotlin = "1.9.24"
core-ktx = "1.13.1"
activity-compose = "1.9.2"
compose-bom = "2024.06.00"
material3 = "1.2.1"
compose-ui = "1.6.8"
navigation-compose = "2.7.7"
okhttp = "4.12.0"
# #122 : scan du QR de l'établissement. Module Play Services téléchargé à la
# demande (rien n'alourdit l'APK), AUCUNE permission CAMERA à déclarer, ~15
# lignes d'appel contre ~120 avec CameraX + aperçu. Apache-2.0 (compatible MIT).
play-services-code-scanner = "16.1.0"

[libraries]
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose-ui" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "play-services-code-scanner" }
