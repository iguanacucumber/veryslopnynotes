# Catalogue seul : aucun build.gradle.kts ne déclare de version de dépendance.
[versions]
agp = "9.5.0"
kotlin = "2.4.21"
core-ktx = "1.19.1"
activity-ktx = "1.13.0"
okhttp = "5.5.1"
# Apache-2.0 (compatible MIT).
security-crypto = "1.1.0"
# Décodeur zxing embarqué : fonctionne sans Google Play Services (émulateur, GMS
# absent). Apache-2.0 (compatible MIT).
zxing-android-embedded = "4.3.0"
# Sync périodique de fond SANS serveur (WorkManager : réseau + batterie, backoff
# exponentiel). Apache-2.0 (compatible MIT).
work = "2.12.0"

[libraries]
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity-ktx" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-android-embedded" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
