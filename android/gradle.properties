# Keystore release : JAMAIS ici (voir docs/RELEASE.md, hors repo).

# Obligatoire : AGP refuse de compiler les AAR AndroidX sans elle.
android.useAndroidX=true

# R non transitives : évite d'hériter du R d'une dépendance.
android.nonTransitiveRClass=true

# Heap du daemon : Compose + KSP/dex dépassent le défaut.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.caching=true

# 30 s et non 3 h (défaut) : ~780 Mo de RSS par daemon, plusieurs worktrees.
org.gradle.daemon.idletimeout=30000
