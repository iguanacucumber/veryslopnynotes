# Propriétés Gradle du module Android (issue #13, ADR-001).
# Keystore release : JAMAIS ici (voir docs/RELEASE.md, hors repo).

# Obligatoire : le projet est 100 % AndroidX (Compose, activity, navigation).
# Sans cette propriété, AGP refuse la compilation des AAR AndroidX.
android.useAndroidX=true

# R classes non transitives : plus rapide, et évite d'hériter de R d'une
# dépendance (surface d'API accidentelle).
android.nonTransitiveRClass=true

# Heap du daemon : Compose + KSP/dex demandent plus que le défaut.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Build hors ligne si le cache est complet, sans réseau tiers.
org.gradle.caching=true