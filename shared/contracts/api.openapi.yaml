      type: object
      required: [ok, event]
      properties:
        ok: { type: boolean, enum: [true], description: Action confirmee par l'app (jamais un faux succes). }
        event:
          $ref: '#/components/schemas/ContractEvent'
          description: >-
            CacheInvalidated (resource discussions) : evenement EXISTANT, aucun
