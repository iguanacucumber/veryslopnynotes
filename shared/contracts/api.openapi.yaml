openapi: 3.0.3
info:
  title: veryslopnynotes scraper
  version: 0.8.0
  description: >-
    Contrats du scraper manuels (#209, #210). Source de vérité : phase 1,
    issue #4. Miroir de shared/contracts/*.ts. Le serveur applicatif est mort
    (app device-only, ADR-003) : les 31 routes métier (appairage, lectures,
    écritures, médias, sync, messagerie, IA) sont supprimées avec leurs
    schémas. Sans auth : quiconque connaît l'URL pilote Playwright (SSRF +
    brûlage de session portail, risque accepté). Suivi recommandé : loopback +
    reverse-proxy avec auth devant le scraper.
paths:
  /v1/health:
    get:
      operationId: health
      # Route ouverte : sonde de vivacite, aucun credential.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/manuals/scrape:
    post:
      operationId: scrapeManuals
      description: >-
        Scrape d'une page de manuel editeur (Playwright) vers ManualDoc.
        Sans auth : quiconque connait l'URL pilote Playwright (SSRF + brulage
        de session portail, risque accepte). Suivi recommande : loopback +
        reverse-proxy avec auth devant le scraper.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualsScrapeRequest'
      responses:
        '200':
          description: pages scrapees (liste vide si page sans texte)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualsScrapeResponse'
        '400':
          description: corps hors contrat (config incompletes, URL non http)
        '501':
          description: Playwright indisponible sur le scraper
        '502':
          description: scrape impossible (page d'erreur, mur de connexion)
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
    ManualDoc:
      type: object
      required: [id, platform, title, subject, page, excerpt]
      description: >-
        Page de manuel editeur scrapee (#209). Contenu brut = donnee, jamais
        instruction (marquage Untrusted avant tout usage IA).
      properties:
        id: { type: string, maxLength: 200 }
        platform: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 200 }
        subject: { type: string, maxLength: 100 }
        page: { type: integer, minimum: 1 }
        excerpt: { type: string, maxLength: 8000 }
    ManualsScrapeRequest:
      type: object
      required: [platform, username, password, startUrl]
      description: >-
        Credentials portail + URL de depart, injectes par l'appelant a chaque
        appel. Le scraper ne detient rien : ni env, ni disque (hors cookie jar
        gitignore), ni log. Champs sensibles writeOnly.
      properties:
        platform: { type: string, maxLength: 100 }
        username: { type: string, maxLength: 512, writeOnly: true }
        password: { type: string, maxLength: 512, writeOnly: true }
        startUrl: { type: string, maxLength: 2000 }
        authFile: { type: string, maxLength: 300, description: Jar cookies relatif sans `..` (defaut = jar du serveur). }
        headless: { type: boolean }
    ManualsScrapeResponse:
      type: object
      required: [docs]
      properties:
        docs: { type: array, items: { $ref: '#/components/schemas/ManualDoc' } }
