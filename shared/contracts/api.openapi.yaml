openapi: 3.0.3
info:
  title: veryslopnynotes API
  version: 0.3.0
  description: Contrats app <-> serveur. Source de vérité (phase 1, issue #4). Miroir de shared/contracts/*.ts.
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/pairing/start:
    post:
      operationId: pairingStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingStartRequest'
      responses:
        '200':
          description: session + code PIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingStartResponse'
  /v1/pairing/confirm:
    post:
      operationId: pairingConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingConfirmRequest'
      responses:
        '200':
          description: appareil appairé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /v1/grades:
    get:
      operationId: listGrades
      description: Notes + rapport de moyennes (fournie sinon estimee, issue #74).
      parameters:
        - name: algorithm
          in: query
          required: false
          schema: { type: string, enum: [subject, weighted, median], default: subject }
        - name: periodId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: notes + moyennes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradesResponse'
  /v1/periods:
    get:
      operationId: listPeriods
      responses:
        '200':
          description: periodes scolaires
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodsResponse'
  /v1/assignments:
    get:
      operationId: listAssignments
      description: >-
        Devoirs avec description, contenu de cours et pieces jointes (issue #75).
        Fenetre ISO optionnelle (weekStart = lundi de la semaine, ou from/to) ;
        date illisible = 400 sans reflet de l'input.
      parameters:
        - name: weekStart
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: devoirs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentsResponse'
        '400':
          description: fenetre de dates illisible
  /v1/assignments/toggle:
    post:
      operationId: toggleAssignmentDone
      description: >-
        Marquer un devoir fait/non fait. ECRITURE vers Pronote declenchee par une
        action APP confirmee uniquement, jamais par une sortie libre LLM (I7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentsToggleRequest'
      responses:
        '200':
          description: devoir a jour + evenement AssignmentUpdated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentsToggleResponse'
        '401':
          description: session Pronote expiree, re-appairage requis
        '409':
          description: devoir introuvable sur la fenetre lue
        '501':
          description: ecriture non supportee par l'adaptateur (aucun faux succes)
  /v1/media:
    get:
      operationId: downloadMedia
      description: >-
        Proxy de piece jointe (issue #75/#84). L'app passe une ref opaque, le
        serveur resout et stream les octets : aucune URL Pronote dans l'app (I1),
        jamais de WebView distante.
      parameters:
        - name: accountId
          in: query
          required: true
          schema: { type: string, maxLength: 64 }
        - name: ref
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: octets du fichier
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: reference invalide
        '401':
          description: session Pronote expiree
        '404':
          description: fichier introuvable
  /v1/timetable:
    get:
      operationId: listTimetable
      description: >-
        EDT d'une fenêtre de semaine (issue #76, add-only). weekStart = un jour de
        la semaine demandée, bornes du lundi 00:00 UTC au dimanche 23:59:59.999
        UTC (offset de fuseau explicite : bug connu de l'onglet EDT Papillon).
        Sans weekStart, from/to bornent la fenêtre ; sans paramètre, aucune
        fenêtre. Une entrée porte prof/statut/cours déplacé si l'établissement
        les publie, champs absents sinon.
      parameters:
        - name: weekStart
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: EDT de la fenêtre (liste vide si aucun cours)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableResponse'
        '400':
          description: fenetre de dates illisible
  /v1/events:
    get:
      operationId: subscribeEvents
      description: SSE serveur->app (GradeCreated, AssignmentUpdated, TimetableUpdated, SyncCompleted, SecurityAlert, NewsUpdated).
      responses:
        '200':
          description: flux text/event-stream d'enveloppes ContractEvent
  /v1/security/alerts:
    get:
      operationId: listSecurityAlerts
      description: Alertes sécurité (injections neutralisées, I6). Excerpt = donnée jamais interprétée.
      responses:
        '200':
          description: liste alertes sécurité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityAlertsResponse'
  /v1/homework/generate:
    post:
      operationId: homeworkGenerate
      description: Assistant devoirs sourcé cours+manuels, JSON validé (phase 9). Refus propre si sources insuffisantes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeworkGenerateRequest'
      responses:
        '200':
          description: corrigé sourcé ou refus propre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkGenerateResponse'
  /v1/revision-sheets:
    get:
      operationId: listRevisionSheets
      responses:
        '200':
          description: fiches révision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionSheetsResponse'
  /v1/revision-sheets/pdf:
    get:
      operationId: exportRevisionSheetPdf
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: fiche en PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /v1/subjects/prefs:
    get:
      operationId: listSubjectPrefs
      description: Préférences matière (couleur/emoji/libellé), add-only #83. Matière sans prefs = nom seul.
      responses:
        '200':
          description: préférences par matière
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectPrefsResponse'
    put:
      operationId: upsertSubjectPrefs
      description: Upsert des préférences d'une matière (clé = nom de matière, corps borné 2048 caractères).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectPrefs'
      responses:
        '200':
          description: préférences enregistrées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectPrefs'

  /v1/evaluations:
    get:
      operationId: listEvaluations
      description: Evaluations par competences (issue #78). Onglet absent de l'etablissement = listes vides.
      responses:
        '200':
          description: competences + evaluations + agregat par competence (notes definies seules)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationsResponse'

  /v1/news:
    get:
      operationId: listNews
      description: Actualites etablissement (issue #79). Onglet inactif = liste vide, jamais 500.
      responses:
        '200':
          description: actualites (liste vide si indisponible)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsResponse'

  /v1/menus:
    get:
      operationId: listCanteenMenus
      description: >-
        Menus cantine de la fenetre (semaine courante par defaut, #81). Tableau
        vide si l'etablissement ne publie aucun menu (capacite dynamique) ;
        balance absente tant que le solde Turboself/ARD n'est pas branche.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: menus cantine + solde optionnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanteenMenusResponse'
        '400':
          description: fenetre de dates illisible

  # #77 vie scolaire : absences/retards unifiés (kind) + compteurs par periode,
  # et sanctions. Onglet vie scolaire inactif = listes vides, jamais 500.
  /v1/attendance:
    get:
      operationId: listAttendance
      parameters:
        - name: periodId
          in: query
          required: false
          schema: { type: string, description: Filtre sur une periode, inconnue -> listes vides. }
      responses:
        '200':
          description: absences + retards + compteurs par periode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
  /v1/punishments:
    get:
      operationId: listPunishments
      responses:
        '200':
          description: sanctions (liste vide si indisponible)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PunishmentsResponse'


  /v1/me:
    get:
      operationId: getMe
      description: >-
        Infos du compte apparie (issue #82, parite Papillon Profil) : nom, classe,
        periode courante, photo (ref opaque resolue par /v1/media) et enfants d'un
        compte parent. user absent = etablissement ne publie rien, aucun nom
        invente. Les periodes de l'annee restent sur /v1/periods.
      responses:
        '200':
          description: profil du compte ou user null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'

  /v1/media:
    get:
      operationId: getMedia
      description: >-
        Proxy serveur d'une ref opaque (photo de profil, piece jointe). Aucune
        adresse Pronote/ENT ne sort cote app (I1) ; le serveur resout et stream
        les octets. Reponse binaire (image ou fichier), pas de JSON.
      parameters:
        - name: ref
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
        - name: accountId
          in: query
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: octets du media
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: ref ou accountId manquant/illisible
  /v1/capabilities:
    get:
      operationId: listCapabilities
      description: >-
        Onglets Pronote actifs de l'etablissement (issue #87). Onglet absent de
        la liste = capacite false : l'app masque l'entree de navigation. Un
        onglet absent cote etablissement n'est jamais une erreur de lecture et
        un `true` n'est jamais devine. `capabilities: null` = capacites non
        determinees (session absente) : l'app garde son affichage par defaut.
      responses:
        '200':
          description: liste des onglets actifs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /v1/sync/refresh:
    post:
      operationId: refreshSync
      description: >-
        Pull-refresh manuel (app -> serveur -> Pronote) : force une relecture
        bornee et renvoie les evenements de sync. Types d'evenements EXISTANTS
        (GradeCreated, TimetableUpdated, SyncCompleted, CacheInvalidated
        resource capabilities), aucun type novel, aucune sortie LLM (I7).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRefreshRequest'
      responses:
        '200':
          description: evenements de la relecture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRefreshResponse'
        '400':
          description: corps illisible
        '401':
          description: session Pronote expiree, re-appairage requis
        '501':
          description: relecture non branchee sur cet adaptateur


  # #80 messagerie (parite Papillon, onglet Discussions). Lectures pures : onglet
  # Discussions inactif cote etablissement = listes VIDES (200), jamais 500.
  # Ecritures = ACTIONS APP CONFIRMEES (I7) : une route POST par action, corps
  # borne avant parse, jamais declenchees par une sortie LLM. `delete` est un
  # POST (le contrat ApiRoute n'accepte que GET/POST/PUT).
  /v1/discussions:
    get:
      operationId: listDiscussions
      description: Fils de discussion (liste). Onglet Discussions absent = liste vide.
      responses:
        '200':
          description: fils de discussion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionsResponse'
    post:
      operationId: createDiscussion
      description: >-
        Nouvelle discussion : ECRITURE Pronote declenchee par une action APP
        CONFIRMEE (I7). Destinataire inconnu = 409, session expiree = 401,
        ecriture non supportee = 501. Jamais un faux succes.
      responses:
        '200':
          description: action confirmee + invalidation de cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionActionResponse'
        '400':
          description: corps hors contrat
        '401':
          description: session Pronote expiree
        '409':
          description: destinataire inconnu
        '501':
          description: ecriture non supportee
  /v1/discussions/messages:
    get:
      operationId: listDiscussionMessages
      description: Messages d'un fil. Fil inconnu ou illisible = liste vide (200).
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: messages du fil (liste vide si indisponible)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionMessagesResponse'
        '400':
          description: id manquant
  /v1/discussions/recipients:
    get:
      operationId: listDiscussionRecipients
      description: Destinataires proposables pour une nouvelle discussion.
      responses:
        '200':
          description: destinataires (liste vide si l'onglet est absent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionRecipientsResponse'
  /v1/discussions/reply:
    post:
      operationId: replyDiscussion
      description: Reponse dans un fil. ECRITURE confirmee par l'app (I7).
      responses:
        '200':
          description: action confirmee + invalidation de cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionActionResponse'
        '400':
          description: corps hors contrat
        '401':
          description: session Pronote expiree
        '409':
          description: fil indisponible ou ferme
        '501':
          description: ecriture non supportee
  /v1/discussions/read-state:
    post:
      operationId: setDiscussionReadState
      description: Marquer un fil lu / non-lu. ECRITURE confirmee par l'app (I7).
      responses:
        '200':
          description: action confirmee + invalidation de cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionActionResponse'
        '400':
          description: corps hors contrat
        '401':
          description: session Pronote expiree
        '409':
          description: fil introuvable
        '501':
          description: ecriture non supportee
  /v1/discussions/delete:
    post:
      operationId: deleteDiscussion
      description: >-
        Mise a la corbeille d'un fil. POST et non DELETE (contrat ApiRoute
        GET/POST/PUT). ECRITURE confirmee par l'app (I7).
      responses:
        '200':
          description: action confirmee + invalidation de cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionActionResponse'
        '400':
          description: corps hors contrat
        '401':
          description: session Pronote expiree
        '409':
          description: fil introuvable
        '501':
          description: ecriture non supportee
components:
  schemas:
    Grade:
      type: object
      required: [id, accountId, subject, value, scale, date]
      properties:
        id: { type: string }
        accountId: { type: string }
        subject: { type: string }
        value: { type: number, minimum: 0 }
        scale: { type: number, exclusiveMinimum: 0 }
        coefficient: { type: number, exclusiveMinimum: 0 }
        date: { type: string, format: date-time }
        classAverage: { type: number }
        classMin: { type: number }
        classMax: { type: number }
        periodId: { type: string }
        bonus: { type: boolean }
        optional: { type: boolean }
        label: { type: string, description: Libelle libre de l'evaluation, donnee jamais instruction (I6). }
        teacher: { type: string }
    Period:
      type: object
      required: [id, name, start, end]
      properties:
        id: { type: string }
        name: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    GeneralAverage:
      type: object
      required: [value, origin, subjectCount]
      properties:
        value: { type: number, nullable: true, description: Sur /20, null si aucune note exploitable. }
        origin: { type: string, enum: [provided, estimated] }
        subjectCount: { type: integer, minimum: 0 }
    SubjectAverage:
      type: object
      required: [subject, value, origin, gradeCount]
      properties:
        subject: { type: string }
        value: { type: number, nullable: true }
        origin: { type: string, enum: [provided, estimated] }
        gradeCount: { type: integer, minimum: 0 }
    GradeInfluence:
      type: object
      required: [gradeId, subject, impact]
      properties:
        gradeId: { type: string }
        subject: { type: string }
        impact: { type: number, description: Ecart de moyenne generale avec/sans la note. }
    AverageHistoryPoint:
      type: object
      required: [date, value]
      properties:
        date: { type: string, format: date-time }
        value: { type: number, nullable: true }
    AveragesReport:
      type: object
      required: [algorithm, periodId, general, subjects, history, influences]
      properties:
        algorithm: { type: string, enum: [subject, weighted, median] }
        periodId: { type: string, nullable: true }
        general: { $ref: '#/components/schemas/GeneralAverage' }
        subjects: { type: array, items: { $ref: '#/components/schemas/SubjectAverage' } }
        history: { type: array, items: { $ref: '#/components/schemas/AverageHistoryPoint' } }
        influences: { type: array, items: { $ref: '#/components/schemas/GradeInfluence' } }
    AttachmentRef:
      type: object
      required: [id, label, ref]
      properties:
        id: { type: string }
        label: { type: string, maxLength: 200 }
        ref:
          type: string
          maxLength: 200
          description: >-
            Reference opaque resolue par le proxy serveur /v1/media. Une URL
            absolue (http://, https://, //, data:) est refusee par le contrat.
    AssignmentLessonContent:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        excerpt: { type: string, maxLength: 500, description: Contenu de cours, donnee jamais instruction (I6). }
    Assignment:
      type: object
      required: [id, accountId, subject, title, dueDate, done]
      properties:
        id: { type: string }
        accountId: { type: string }
        subject: { type: string }
        title: { type: string }
        dueDate: { type: string, format: date-time }
        done: { type: boolean }
        description: { type: string, maxLength: 2000, description: Consigne du devoir, donnee externe bornee (I6). }
        lessonContent: { $ref: '#/components/schemas/AssignmentLessonContent' }
        attachments: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/AttachmentRef' } }
        periodId: { type: string }
        weekId: { type: string }
    TimetableEntry:
      type: object
      required: [id, accountId, subject, start, end]
      properties:
        id: { type: string }
        accountId: { type: string }
        subject: { type: string }
        room: { type: string, maxLength: 100 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        teacher: { type: string, maxLength: 100, description: Enseignant, absent si non publie. }
        status:
          type: string
          enum: [normal, cancelled, moved]
          description: Statut publie, absent si l'etablissement ne le publie pas (jamais "normal" par defaut).
        originalStart: { type: string, format: date-time, description: Horaires d'origine d'un cours deplace. }
        originalEnd: { type: string, format: date-time }
    Device:
      type: object
      required: [id, tokenHash]
      properties:
        id: { type: string }
        tokenHash: { type: string, description: Empreinte du token push, jamais le token brut. }
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
    PairingStartRequest:
      type: object
      required: [deviceName]
      properties:
        deviceName: { type: string }
    PairingStartResponse:
      type: object
      required: [sessionId, code]
      properties:
        sessionId: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    PairingConfirmRequest:
      type: object
      required: [sessionId, code]
      properties:
        sessionId: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    GradesResponse:
      type: object
      required: [grades, averages]
      properties:
        grades: { type: array, items: { $ref: '#/components/schemas/Grade' } }
        averages: { $ref: '#/components/schemas/AveragesReport' }
    PeriodsResponse:
      type: object
      required: [periods]
      properties:
        periods: { type: array, items: { $ref: '#/components/schemas/Period' } }
    AssignmentsResponse:
      type: object
      required: [assignments]
      properties:
        assignments: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
    AssignmentsToggleRequest:
      type: object
      required: [assignmentId, done]
      properties:
        accountId: { type: string, maxLength: 64, description: Absent = serveur mono-compte (session appairee resolue cote serveur). }
        assignmentId: { type: string, maxLength: 64 }
        done: { type: boolean }
    AssignmentsToggleResponse:
      type: object
      required: [assignment, event]
      properties:
        assignment: { $ref: '#/components/schemas/Assignment' }
        event: { $ref: '#/components/schemas/ContractEvent' }
    TimetableResponse:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/TimetableEntry' } }
    RevisionSheet:
      type: object
      required: [id, examId, subject, date, title, body, sources, templateVersion, createdAt]
      properties:
        id: { type: string }
        examId: { type: string }
        subject: { type: string }
        date: { type: string, format: date-time }
        title: { type: string }
        body: { type: string }
        sources: { type: array, items: { type: string } }
        templateVersion: { type: string, enum: [fiche-v1] }
        createdAt: { type: string, format: date-time }
    RevisionSheetsResponse:
      type: object
      required: [sheets]
      properties:
        sheets: { type: array, items: { $ref: '#/components/schemas/RevisionSheet' } }
    ContractEvent:
      type: object
      required: [v, type, at, data]
      properties:
        v: { type: string, enum: ['0.3.0'] }
