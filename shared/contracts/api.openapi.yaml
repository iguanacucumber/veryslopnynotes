openapi: 3.0.3
info:
  title: veryslopnynotes scraper
  version: 0.10.0
  description: >-
    Contrats du scraper manuels (#209, #210). Source de vérité : phase 1,
    issue #4. Miroir de shared/contracts/*.ts. Le serveur applicatif est mort
    (app device-only, ADR-003) : les 31 routes métier (appairage, lectures,
    écritures, médias, sync, messagerie, IA) sont supprimées avec leurs
    schémas. Sans auth : quiconque connaît l'URL pilote Playwright (SSRF +
    brûlage de session portail, risque accepté). Suivi recommandé : loopback +
    reverse-proxy avec auth devant le scraper.
paths:
  /v1/health:
    get:
      operationId: health
      # Route ouverte : sonde de vivacite, aucun credential.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/manuals/scrape:
    post:
      operationId: scrapeManuals
      description: >-
        Scrape d'une page de manuel editeur (Playwright) vers ManualDoc.
        Sans auth : quiconque connait l'URL pilote Playwright (SSRF + brulage
        de session portail, risque accepte). Suivi recommande : loopback +
        reverse-proxy avec auth devant le scraper.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualsScrapeRequest'
      responses:
        '200':
          description: pages scrapees (liste vide si page sans texte)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualsScrapeResponse'
        '400':
          description: >-
            corps hors contrat (config incompletes, URL non http) ou corps
            portant des identifiants de portail (username/password) : le
            scraper ne s'authentifie pas (#526)
        '403':
          description: hote prive/interne refuse (garde SSRF : nom resolu vers une IP interne)
        '501':
          description: Playwright indisponible sur le scraper
        '502':
          description: >-
            scrape impossible (page d'erreur, mur de connexion, nom d'hote
            introuvable, page de connexion detectee : la session du scraper
            est a renouveler)
        '503':
          description: >-
            scraper occupe (plafond de concurrence : 2 scrapes en vol, les
            suivants sont refuses avec un en-tete Retry-After)
        '504':
          description: >-
            delai de scrape depasse (30 s) ou lecture de la page trop longue
            (le HTML recupere est borne a 1 Mo de caracteres)
  /v1/web/scrape:
    post:
      operationId: scrapeWebPage
      description: >-
        Scrape d'une page web publique choisie par l'eleve (#634) vers titre +
        texte. Meme garde SSRF que le scrape de manuel (hote prive/loopback/
        link-local/metadata et redirections refuses, nom resolu avant
        navigation), SANS jar de session : aucune authentification, aucun
        cookie de l'eleve. Le contenu non textuel est refuse. La reponse ne
        contient jamais l'URL demandee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebScrapeRequest'
      responses:
        '200':
          description: page scrapee (liste vide si page sans texte)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebScrapeResponse'
        '400':
          description: >-
            corps hors contrat ou URL non http(s), avec identifiants, ou hote
            prive/interne litteral
        '403':
          description: hote prive/interne refuse (garde SSRF : nom resolu vers une IP interne)
        '413':
          description: page trop volumineuse (contenu non lu)
        '415':
          description: contenu non textuel refuse (content-type non texte)
        '501':
          description: Playwright indisponible sur le scraper
        '502':
          description: scrape impossible (page d'erreur, nom d'hote introuvable)
        '503':
          description: >-
            scraper occupe (plafond de concurrence : 2 scrapes en vol, les
            suivants sont refuses avec un en-tete Retry-After)
        '504':
          description: >-
            delai de scrape depasse (30 s) ou lecture de la page trop longue
            (le HTML recupere est borne a 1 Mo de caracteres)
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
    ManualDoc:
      type: object
      required: [id, platform, title, subject, page, excerpt]
      description: >-
        Page de manuel editeur scrapee (#209). Contenu brut = donnee, jamais
        instruction (marquage Untrusted avant tout usage IA).
      properties:
        id: { type: string, maxLength: 200 }
        platform: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 200 }
        subject: { type: string, maxLength: 100 }
        page: { type: integer, minimum: 1 }
        excerpt: { type: string, maxLength: 8000 }
    ManualsScrapeRequest:
      type: object
      required: [platform, startUrl]
      description: >-
        Plateforme + URL de depart, injectes par l'appelant a chaque appel.
        Le scraper ne detient rien : ni env, ni disque (hors cookie jar
        gitignore), ni log. Champs sensibles writeOnly. Le jar de session est
        choisi par le SERVEUR : aucun champ ne permet a l'appelant de
        demander la session d'un autre tenant (#538).
        Les identifiants de portail (username/password) ne sont PLUS exiges :
        le scraper ne s'authentifie pas (la session est celle du serveur,
        #526). Ils restent declares en optionnel pour que les appelants
        existants compilent, mais un corps qui les porte est REFUSE (400).
      properties:
        platform: { type: string, maxLength: 100 }
        username: { type: string, maxLength: 512, writeOnly: true, description: Obsolete, refuse par le serveur (#526) : le scraper ne s'authentifie pas. }
        password: { type: string, maxLength: 512, writeOnly: true, description: Obsolete, refuse par le serveur (#526) : le scraper ne s'authentifie pas. }
        startUrl: { type: string, maxLength: 2000 }
        headless: { type: boolean }
    ManualsScrapeResponse:
      type: object
      required: [docs]
      properties:
        docs: { type: array, items: { $ref: '#/components/schemas/ManualDoc' } }
    WebScrapeRequest:
      type: object
      required: [url]
      description: >-
        URL d'une page web publique saisie par l'eleve. Write-only : jamais
        journalisee, jamais renvoyee, jamais transmise a l'etablissement.
      properties:
        url: { type: string, maxLength: 2000 }
    WebDoc:
      type: object
      required: [title, excerpt]
      description: >-
        Page web scrapee (#634). Contenu brut = donnee, jamais instruction
        (marquage Untrusted avant tout usage IA).
      properties:
        title: { type: string, maxLength: 200 }
        excerpt: { type: string, maxLength: 8000 }
    WebScrapeResponse:
      type: object
      required: [docs]
      properties:
        docs: { type: array, items: { $ref: '#/components/schemas/WebDoc' } }
