openapi: 3.0.3
info:
  title: veryslopnynotes API
  version: 0.2.0
  description: Contrats app <-> serveur. Source de vérité (phase 1, issue #4). Miroir de shared/contracts/*.ts.
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/pairing/start:
    post:
      operationId: pairingStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingStartRequest'
      responses:
        '200':
          description: session + code PIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingStartResponse'
  /v1/pairing/confirm:
    post:
      operationId: pairingConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingConfirmRequest'
      responses:
        '200':
          description: appareil appairé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /v1/grades:
    get:
      operationId: listGrades
      description: Notes + rapport de moyennes (fournie sinon estimee, issue #74).
      parameters:
        - name: algorithm
          in: query
          required: false
          schema: { type: string, enum: [subject, weighted, median], default: subject }
        - name: periodId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: notes + moyennes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradesResponse'
  /v1/periods:
    get:
      operationId: listPeriods
      responses:
        '200':
          description: periodes scolaires
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodsResponse'
  /v1/assignments:
    get:
      operationId: listAssignments
      responses:
        '200':
          description: devoirs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentsResponse'
  /v1/timetable:
    get:
      operationId: listTimetable
      responses:
        '200':
          description: EDT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableResponse'
  /v1/events:
    get:
      operationId: subscribeEvents
      description: SSE serveur->app (GradeCreated, AssignmentUpdated, TimetableUpdated, SyncCompleted, SecurityAlert, NewsUpdated).
      responses:
        '200':
          description: flux text/event-stream d'enveloppes ContractEvent
  /v1/security/alerts:
    get:
      operationId: listSecurityAlerts
      description: Alertes sécurité (injections neutralisées, I6). Excerpt = donnée jamais interprétée.
      responses:
        '200':
          description: liste alertes sécurité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityAlertsResponse'
  /v1/homework/generate:
    post:
      operationId: homeworkGenerate
      description: Assistant devoirs sourcé cours+manuels, JSON validé (phase 9). Refus propre si sources insuffisantes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeworkGenerateRequest'
      responses:
        '200':
          description: corrigé sourcé ou refus propre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeworkGenerateResponse'
  /v1/revision-sheets:
    get:
      operationId: listRevisionSheets
      responses:
        '200':
          description: fiches révision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionSheetsResponse'
  /v1/revision-sheets/pdf:
    get:
      operationId: exportRevisionSheetPdf
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: fiche en PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /v1/subjects/prefs:
    get:
      operationId: listSubjectPrefs
      description: Préférences matière (couleur/emoji/libellé), add-only #83. Matière sans prefs = nom seul.
      responses:
        '200':
          description: préférences par matière
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectPrefsResponse'
    put:
      operationId: upsertSubjectPrefs
      description: Upsert des préférences d'une matière (clé = nom de matière, corps borné 2048 caractères).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectPrefs'
      responses:
        '200':
          description: préférences enregistrées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectPrefs'

  /v1/evaluations:
    get:
      operationId: listEvaluations
      description: Evaluations par competences (issue #78). Onglet absent de l'etablissement = listes vides.
      responses:
        '200':
          description: competences + evaluations + agregat par competence (notes definies seules)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationsResponse'

  /v1/news:
    get:
      operationId: listNews
      description: Actualites etablissement (issue #79). Onglet inactif = liste vide, jamais 500.
      responses:
        '200':
          description: actualites (liste vide si indisponible)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsResponse'

  /v1/menus:
    get:
      operationId: listCanteenMenus
      description: >-
        Menus cantine de la fenetre (semaine courante par defaut, #81). Tableau
        vide si l'etablissement ne publie aucun menu (capacite dynamique) ;
        balance absente tant que le solde Turboself/ARD n'est pas branche.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: menus cantine + solde optionnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanteenMenusResponse'
        '400':
          description: fenetre de dates illisible

  # #77 vie scolaire : absences/retards unifiés (kind) + compteurs par periode,
  # et sanctions. Onglet vie scolaire inactif = listes vides, jamais 500.
  /v1/attendance:
    get:
      operationId: listAttendance
      parameters:
        - name: periodId
          in: query
          required: false
          schema: { type: string, description: Filtre sur une periode, inconnue -> listes vides. }
      responses:
        '200':
          description: absences + retards + compteurs par periode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
  /v1/punishments:
    get:
      operationId: listPunishments
      responses:
        '200':
          description: sanctions (liste vide si indisponible)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PunishmentsResponse'
components:
  schemas:
    Grade:
      type: object
      required: [id, accountId, subject, value, scale, date]
      properties:
        id: { type: string }
        accountId: { type: string }
        subject: { type: string }
        value: { type: number, minimum: 0 }
        scale: { type: number, exclusiveMinimum: 0 }
        coefficient: { type: number, exclusiveMinimum: 0 }
        date: { type: string, format: date-time }
        classAverage: { type: number }
        classMin: { type: number }
        classMax: { type: number }
        periodId: { type: string }
        bonus: { type: boolean }
        optional: { type: boolean }
        label: { type: string, description: Libelle libre de l'evaluation, donnee jamais instruction (I6). }
        teacher: { type: string }
    Period:
      type: object
      required: [id, name, start, end]
      properties:
        id: { type: string }
        name: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    GeneralAverage:
      type: object
      required: [value, origin, subjectCount]
      properties:
        value: { type: number, nullable: true, description: Sur /20, null si aucune note exploitable. }
        origin: { type: string, enum: [provided, estimated] }
        subjectCount: { type: integer, minimum: 0 }
    SubjectAverage:
      type: object
      required: [subject, value, origin, gradeCount]
      properties:
        subject: { type: string }
        value: { type: number, nullable: true }
        origin: { type: string, enum: [provided, estimated] }
        gradeCount: { type: integer, minimum: 0 }
    GradeInfluence:
      type: object
      required: [gradeId, subject, impact]
      properties:
        gradeId: { type: string }
        subject: { type: string }
        impact: { type: number, description: Ecart de moyenne generale avec/sans la note. }
    AverageHistoryPoint:
      type: object
      required: [date, value]
      properties:
        date: { type: string, format: date-time }
        value: { type: number, nullable: true }
    AveragesReport:
      type: object
      required: [algorithm, periodId, general, subjects, history, influences]
      properties:
        algorithm: { type: string, enum: [subject, weighted, median] }
        periodId: { type: string, nullable: true }
        general: { $ref: '#/components/schemas/GeneralAverage' }
        subjects: { type: array, items: { $ref: '#/components/schemas/SubjectAverage' } }
        history: { type: array, items: { $ref: '#/components/schemas/AverageHistoryPoint' } }
        influences: { type: array, items: { $ref: '#/components/schemas/GradeInfluence' } }
    Assignment:
      type: object
      required: [id, accountId, subject, title, dueDate, done]
      properties:
        id: { type: string }
        accountId: { type: string }
        subject: { type: string }
        title: { type: string }
        dueDate: { type: string, format: date-time }
        done: { type: boolean }
    TimetableEntry:
      type: object
      required: [id, accountId, subject, start, end]
      properties:
        id: { type: string }
        accountId: { type: string }
        subject: { type: string }
        room: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    Device:
      type: object
      required: [id, tokenHash]
      properties:
        id: { type: string }
        tokenHash: { type: string, description: Empreinte du token push, jamais le token brut. }
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
    PairingStartRequest:
      type: object
      required: [deviceName]
      properties:
        deviceName: { type: string }
    PairingStartResponse:
      type: object
      required: [sessionId, code]
      properties:
        sessionId: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    PairingConfirmRequest:
      type: object
      required: [sessionId, code]
      properties:
        sessionId: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    GradesResponse:
      type: object
      required: [grades, averages]
      properties:
        grades: { type: array, items: { $ref: '#/components/schemas/Grade' } }
        averages: { $ref: '#/components/schemas/AveragesReport' }
    PeriodsResponse:
      type: object
      required: [periods]
      properties:
        periods: { type: array, items: { $ref: '#/components/schemas/Period' } }
    AssignmentsResponse:
      type: object
      required: [assignments]
      properties:
        assignments: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
    TimetableResponse:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/TimetableEntry' } }
    RevisionSheet:
      type: object
      required: [id, examId, subject, date, title, body, sources, templateVersion, createdAt]
      properties:
        id: { type: string }
        examId: { type: string }
        subject: { type: string }
        date: { type: string, format: date-time }
        title: { type: string }
        body: { type: string }
        sources: { type: array, items: { type: string } }
        templateVersion: { type: string, enum: [fiche-v1] }
        createdAt: { type: string, format: date-time }
    RevisionSheetsResponse:
      type: object
      required: [sheets]
      properties:
        sheets: { type: array, items: { $ref: '#/components/schemas/RevisionSheet' } }
    ContractEvent:
      type: object
      required: [v, type, at, data]
      properties:
        v: { type: string, enum: ['0.2.0'] }
        type: { type: string, enum: [GradeCreated, AssignmentUpdated, TimetableUpdated, SyncCompleted, CacheInvalidated, SecurityAlert, NewsUpdated] }
        at: { type: string, format: date-time }
        data: { type: object }
    SecurityAlert:
      type: object
      required: [id, kind, excerpt, source]
      properties:
        id: { type: string }
        kind: { type: string, enum: [injection_neutralized] }
        excerpt: { type: string, description: Extrait suspect, donnée jamais interprétée (I6). }
        source: { type: string }
    SecurityAlertsResponse:
      type: object
      required: [alerts]
      properties:
        alerts: { type: array, items: { $ref: '#/components/schemas/SecurityAlert' } }
    HomeworkSource:
      type: object
      required: [text, source]
      properties:
        text: { type: string, maxLength: 2000 }
        source: { type: string, maxLength: 200 }
    HomeworkGenerateRequest:
      type: object
      required: [question, sources]
      properties:
        question: { type: string, maxLength: 2000 }
        sources: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/HomeworkSource' } }
    HomeworkGenerateResponse:
      type: object
      required: [status, sources]
      properties:
        status: { type: string, enum: [ok, refused] }
        answer: { type: string }
        steps: { type: array, items: { type: string } }
        reason: { type: string }
        sources: { type: array, items: { type: string } }
    SubjectPrefs:
      type: object
      required: [subject, updatedAt]
      properties:
        subject: { type: string, maxLength: 64 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', description: Couleur d'affichage, #RRGGBB strict. }
        emoji: { type: string, maxLength: 8, description: Emoji court (points de code), absent = aucun. }
        label: { type: string, maxLength: 64, description: Libellé personnalisé, absent = nom d'origine. }
        updatedAt: { type: string, format: date-time }
    SubjectPrefsResponse:
      type: object
      required: [prefs]
      properties:
        prefs: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/SubjectPrefs' } }

    Skill:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string, maxLength: 100 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', description: Couleur de chip, absente si non publiee. }
    Evaluation:
      type: object
      required: [id, accountId, subject, skillId, label, note, scale, date]
      properties:
        id: { type: string }
        accountId: { type: string }
        periodId: { type: string }
        subject: { type: string }
        skillId: { type: string }
        label: { type: string, maxLength: 200, description: Donnee externe bornee, jamais instruction (I6). }
        note: { type: number, nullable: true, minimum: 0, description: null = non notee, ignoree par les calculs. }
        scale: { type: number, exclusiveMinimum: 0 }
        date: { type: string, format: date-time }
        classAverage: { type: number }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    CompetenceSummary:
      type: object
      required: [skillId, label, subject, value, evaluationCount]
      properties:
        skillId: { type: string }
        label: { type: string, maxLength: 100 }
        subject: { type: string }
        value: { type: number, nullable: true, description: Sur /20, null si aucune note definie. }
        evaluationCount: { type: integer, minimum: 0, description: Notes definies seulement. }
    EvaluationsResponse:
      type: object
      required: [skills, evaluations, summary]
      properties:
        skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        evaluations: { type: array, items: { $ref: '#/components/schemas/Evaluation' } }
        summary: { type: array, items: { $ref: '#/components/schemas/CompetenceSummary' } }

    NewsItem:
      type: object
      required: [id, accountId, title, publishedAt]
      properties:
        id: { type: string }
        accountId: { type: string }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 2000, description: Contenu etablissement, donnee jamais instruction (I6). }
        publishedAt: { type: string, format: date-time }
        category: { type: string, maxLength: 100 }
        author: { type: string, maxLength: 100 }
        read: { type: boolean }
    NewsResponse:
      type: object
      required: [news]
      properties:
        news: { type: array, items: { $ref: '#/components/schemas/NewsItem' } }

    CanteenMenu:
      type: object
      required: [id, accountId, date, meal, dishes]
      properties:
        id: { type: string }
        accountId: { type: string }
        date: { type: string, format: date-time, description: Jour de service. }
        meal: { type: string, enum: [breakfast, lunch, dinner] }
        dishes: { type: array, maxItems: 20, items: { type: string, maxLength: 120 }, description: Donnee Pronote, jamais instruction (I6). }
        allergens: { type: array, maxItems: 14, items: { type: string, maxLength: 40 } }
        status: { type: string, enum: [served, planned] }
    CanteenBalance:
      type: object
      required: [balance, updatedAt]
      properties:
        balance: { type: number }
        currency: { type: string, maxLength: 8 }
        updatedAt: { type: string, format: date-time }
    CanteenMenusResponse:
      type: object
      required: [menus]
      properties:
        menus: { type: array, items: { $ref: '#/components/schemas/CanteenMenu' } }
        balance: { $ref: '#/components/schemas/CanteenBalance' }

    AbsenceRecord:
      type: object
      required: [id, accountId, kind, date]
      properties:
        id: { type: string }
        accountId: { type: string }
        kind: { type: string, enum: [absence, late] }
        date: { type: string, format: date-time }
        dateEnd: { type: string, format: date-time, description: Fin d'absence, >= date. }
        subject: { type: string, maxLength: 64 }
        motif: { type: string, maxLength: 500, description: Motif declare, donnee jamais instruction (I6). }
        periodId: { type: string }
        durationMinutes: { type: number, minimum: 0 }
        justified: { type: boolean }
    Punishment:
      type: object
      required: [id, accountId, date, motif, type]
      properties:
        id: { type: string }
        accountId: { type: string }
        date: { type: string, format: date-time }
        dateEnd: { type: string, format: date-time, description: Fin de sanction, >= date. }
        motif: { type: string, maxLength: 500, description: Motif de la sanction, donnee jamais instruction (I6). }
        type: { type: string, maxLength: 100, description: Nature de la sanction. }
        gravity: { type: number, minimum: 0, description: Gravite publiee par l'etablissement. }
        periodId: { type: string }
    AttendancePeriod:
      type: object
      required: [periodId, absences, late, missingMinutes]
      properties:
        periodId: { type: string }
        name: { type: string, maxLength: 100 }
        absences: { type: integer, minimum: 0 }
        late: { type: integer, minimum: 0 }
        missingMinutes: { type: integer, minimum: 0 }
    AttendanceResponse:
      type: object
      required: [absences, periods]
      properties:
        absences: { type: array, items: { $ref: '#/components/schemas/AbsenceRecord' } }
        periods: { type: array, items: { $ref: '#/components/schemas/AttendancePeriod' } }
    PunishmentsResponse:
      type: object
      required: [punishments]
      properties:
        punishments: { type: array, items: { $ref: '#/components/schemas/Punishment' } }
