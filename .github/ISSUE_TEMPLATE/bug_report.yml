name: Bug
description: Signaler un dysfonctionnement reproductible, sans donnée scolaire.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Une issue = un problème reproductible. **Ne joins aucune donnée
        scolaire** : pas de nom, d'URL d'établissement, de note, de message,
        de pièce jointe ni de capture non caviardée.

        Une faille exploitable ne s'ouvre pas ici : utilise
        [GitHub Security Advisories](https://github.com/iguanacucumber/veryslopnynotes/security/advisories/new).

  - type: textarea
    id: probleme
    attributes:
      label: Problème
      description: Ce qui ne va pas, en une phrase.
      placeholder: "Exemple : les notes restent vides après un rafraîchissement."
    validations:
      required: true

  - type: textarea
    id: etapes
    attributes:
      label: Étapes de reproduction
      description: Le chemin exact, sans renseigner de contenu scolaire.
      placeholder: |
        1. Ouvrir ...
        2. Toucher ...
        3. Observer ...
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: Attendu et obtenu
      description: Ce que tu attendais, puis ce qui s'est produit.
    validations:
      required: true

  - type: input
    id: version-app
    attributes:
      label: Version de l'app
      description: Réglages Android → Applications → VerySlopyNyNotes, ou le nom de l'APK.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: version-android
    attributes:
      label: Version d'Android
      description: Réglages → À propos du téléphone.
      placeholder: "Android 14"
    validations:
      required: true

  - type: input
    id: version-webview
    attributes:
      label: Version de la WebView
      description: Réglages → Applications → Android System WebView (ou Chrome).
      placeholder: "Chromium 131"
    validations:
      required: true

  - type: dropdown
    id: compatibilite
    attributes:
      label: État de l'appairage
      description: Aide à distinguer un bug de l'app d'une limite de l'établissement.
      options:
        - QR + PIN : l'appairage fonctionne
        - QR + PIN refusé (qr_rejected, login_refused)
        - Double authentification demandée (mfa_required)
        - Pas encore appairé, ou connexion démonstration
        - Autre
    validations:
      required: true

  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic
      description: Message d'erreur exact, code affiché et ressource concernée. Pas de contenu scolaire.
      placeholder: |
        Code : ...
        Message : ...
        Ressource : notes / devoirs / messages / autre
    validations:
      required: true

  - type: textarea
    id: captures
    attributes:
      label: Captures (facultatif)
      description: Glisse ici des images **caviardées**. Pas d'URL, de nom, de note ni de message visible.

  - type: checkboxes
    id: donnees
    attributes:
      label: Données et sécurité
      options:
        - label: J'ai retiré noms, URL d'établissement, notes, messages et identifiants de toute capture.
          required: true
        - label: Je n'ai pas ouvert de faille exploitable ici ; elle passe par GitHub Security Advisories.
          required: true
