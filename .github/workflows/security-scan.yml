# CI-08 : la chaîne d'approvisionnement, pas seulement le code.
#
# Trois contrôles indépendants du gate de compilation :
#   - `dependency-review` diffe le graphe de dépendances de la PR et échoue sur
#     une vulnérabilité HIGH ou CRITICAL introduite (le défaut de l'action est
#     LOW : on le relève explicitement). Si le graphe de dépendances du dépôt
#     n'est pas activé, l'action ne peut pas lire l'API : le job se replie sur
#     `bun audit --audit-level=high`, déclenché seulement quand une PR touche un
#     manifeste. Le repli est plus strict (tout le graphe), jamais plus laxiste ;
#   - le job `server-image` construit `Dockerfile.server`, scanne l'IMAGE avec
#     Trivy, puis DÉMARRE ce conteneur derrière TLS + jeton et attend que
#     `/v1/ready` réponde ET que le HEALTHCHECK passe : une image qui build et
#     se scanne mais ne sert rien n'est pas livrable (#920). Le binaire Trivy
#     est épinglé et vérifié par SHA-256, et un cache indisponible ne change pas
#     le verdict (`continue-on-error` sur le cache SEULEMENT) ;
#   - les empreintes Gradle vivent dans `android/gradle/verification-metadata.xml`
#     et sont appliquées par le `android-compile` du gate : un artefact inconnu
#     fait échouer `make check`, pas seulement un job séparé.
#
# `--ignore-unfixed` est une décision de POLITIQUE, pas un adoucissement : une
# CVE sans version corrigée disponible ne peut être réparée par aucune PR. Toute
# trouvaille HIGH/CRITICAL avec un correctif reste bloquante (`--exit-code 1`).
#
# Aucun secret : les jobs lisent le dépôt public et ne commentent pas la PR
# (`comment-summary-in-pr: never`), donc `contents: read` suffit.

name: security-scan

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : les scans lisent le dépôt, ils n'écrivent rien sur GitHub.
permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # L'API de revue de dépendances compare une PR à sa base : rien à diffuser
    # sur un push de `main`, où le graphe est déjà celui qui a été fusionné.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le repli compare le manifeste de la PR à la base : l'historique
          # superficiel par défaut ne contient pas ce commit.
          fetch-depth: 0
          persist-credentials: false

      # Le graphe de dépendances est un réglage du dépôt, pas du workflow. On
      # le SONDE au lieu de supposer : un 404 (fonction désactivée) bascule sur
      # le repli, sans jamais rendre le job vert à vide.
      - name: Graphe de dépendances
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::graphe de dépendances indisponible — repli bun audit (plus strict)."
          fi

      # Le repli exécute `bun audit` : sans runtime installé, le job échoue en
      # 127 au lieu d'auditer. Le test d'architecture verrouille ce câblage.
      - name: Bun (repli)
        if: steps.graph.outputs.supported != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Revue des dépendances
        if: steps.graph.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

      # Repli quand l'API de revue n'est pas disponible : `bun audit` est déjà
      # l'audit du gate, il échoue sur HIGH/CRITICAL. Il est déclenché par un
      # diff de manifeste, pas par n'importe quelle PR sans dépendance.
      - name: Repli bun audit
        if: steps.graph.outputs.supported != 'true'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- \
            package.json bun.lock android/gradle/libs.versions.toml)
          if [ -z "$changed" ]; then
            echo "aucune dépendance modifiée par la PR"
            exit 0
          fi
          printf 'manifestes modifiés :\n%s\n' "$changed"
          bun audit --audit-level=high

  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy épinglé
        run: |
          set -euo pipefail
          version=0.76.1
          archive="trivy_${version}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/trivy"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          # Un binaire substitué rendrait le verdict du scan : l'empreinte est
          # comparée AVANT l'extraction.
          printf '%s  %s\n' \
            'c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0' "$RUNNER_TEMP/$archive" |
            sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy" trivy
          "$RUNNER_TEMP/trivy/trivy" --version

      # La base de vulnérabilités est un CACHE, jamais une condition de
      # verdeur : une panne du service de cache ralentit le run, elle ne le
      # rougit pas. Une base périmée est mise à jour par Trivy lui-même.
      - name: Cache Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Arbre courant : dépendances bun (production), secrets de l'arbre et
      # configuration Dockerfile. Une trouvaille HIGH/CRITICAL avec correctif
      # fait échouer le job.
      - name: Scan de l'arbre
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trivy/trivy" fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            . | tee "$RUNNER_TEMP/trivy-fs.txt"

      # L'image réellement livrable, pas seulement son Dockerfile. Le build est
      # fait ici : scanner une image d'un run précédent ne prouverait rien.
      - name: Image serveur
        run: |
          set -euo pipefail
          docker build -t veryslopnynotes-server:scan -f Dockerfile.server .

      # `@typescript/typescript-linux-x64/lib/tsc` est un binaire Go de
      # développement, livré parce que l'image installe toutes les dépendances
      # (playwright, devDependency, sert AU RUNTIME). Le serveur n'appelle
      # jamais `tsc` : ses CVE Go ne sont pas celles du conteneur exécuté. Le
      # scan de l'ARBRE garde la porte ouverte sur `bun.lock` ; l'image garde
      # l'OS et les paquets npm : seul ce binaire d'outillage est exempté.
      - name: Scan de l'image
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trivy/trivy" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs app/node_modules/@typescript \
            --exit-code 1 \
            --no-progress \
            veryslopnynotes-server:scan | tee "$RUNNER_TEMP/trivy-image.txt"

      # Le certificat ne protège que le runner : jetable, généré ici, jamais
      # commité. Il est lisible par vsn (uid 10001) car le conteneur tourne
      # non-root ; la clé ne quitte pas $RUNNER_TEMP.
      - name: TLS de test
        run: |
          set -euo pipefail
          tls="$RUNNER_TEMP/tls"
          mkdir -p "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$tls/key.pem" -out "$tls/cert.pem" \
            -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" \
            >/dev/null 2>&1
          chmod 644 "$tls/cert.pem" "$tls/key.pem"

      # Même commande que `server/README.md`, à l'image scannée près. Hors
      # loopback (0.0.0.0 pour publier le port) le service exige ALLOW_PUBLIC=1
      # ET un jeton Bearer ; le jeton ci-dessous est une valeur de TEST, pas un
      # secret : il ne protège que cette boucle locale et meurt avec le run.
      - name: Conteneur serveur
        env:
          SCRAPER_TOKEN: ci-server-image-smoke
        run: |
          set -euo pipefail
          docker run -d --name vsn-server-image \
            -p 127.0.0.1:3000:3000 \
            --read-only --cap-drop=ALL --security-opt no-new-privileges \
            --security-opt seccomp=./server/chromium-seccomp.json \
            --memory=1g --memory-swap=1g --cpus=1 --pids-limit=256 --stop-timeout=40 \
            --tmpfs /tmp --tmpfs /home/vsn:rw,nosuid,nodev,size=64m,mode=1777 \
            -v vsn-ci-jar:/app/playwright/.auth \
            -e HOST=0.0.0.0 -e ALLOW_PUBLIC=1 -e SCRAPER_TOKEN \
            -e TLS_CERT_FILE=/tls/cert.pem -e TLS_KEY_FILE=/tls/key.pem \
            -v "$RUNNER_TEMP/tls:/tls:ro" \
            veryslopnynotes-server:scan

      # Disponibilité RÉELLE : le jar est inscriptible et Chromium installé
      # (Dockerfile). Sans jeton la route doit refuser (I8) : un 200 anonyme
      # serait une régression de sécurité, pas un succès de smoke.
      - name: Disponibilité
        env:
          SCRAPER_TOKEN: ci-server-image-smoke
        run: |
          set -euo pipefail
          url=https://127.0.0.1:3000/v1/ready
          deadline=$((SECONDS + 120))
          until curl -fsS --insecure --max-time 5 \
            -H "Authorization: Bearer $SCRAPER_TOKEN" "$url" >/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::/v1/ready ne répond pas après 120 s"
              docker logs vsn-server-image || true
              exit 1
            fi
            sleep 2
          done
          code=$(curl -sS --insecure --max-time 5 -o /dev/null -w '%{http_code}' "$url")
          if [ "$code" != "401" ]; then
            echo "::error::/v1/ready sans jeton = $code (401 attendu, I8)"
            exit 1
          fi
          curl -fsS --insecure --max-time 5 \
            -H "Authorization: Bearer $SCRAPER_TOKEN" \
            https://127.0.0.1:3000/v1/health >/dev/null
          echo "disponibilité : /v1/ready 200 avec jeton, 401 sans jeton"

      # Le HEALTHCHECK de l'image est la preuve demandée : on attend le verdict
      # de Docker, pas seulement une réponse HTTP. `unhealthy` = échec immédiat.
      - name: Santé du conteneur
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          while :; do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}absent{{end}}' vsn-server-image)
            if [ "$status" = "healthy" ]; then
              echo "santé : healthy"
              exit 0
            fi
            if [ "$status" != "starting" ]; then
              echo "::error::santé du conteneur = $status"
              docker inspect --format '{{json .State.Health}}' vsn-server-image || true
              docker logs vsn-server-image || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::santé toujours « starting » après 90 s"
              docker inspect --format '{{json .State.Health}}' vsn-server-image || true
              docker logs vsn-server-image || true
              exit 1
            fi
            sleep 3
          done

      - name: Journaux du conteneur
        if: always()
        run: docker logs vsn-server-image 2>&1 || true

      - name: Nettoyage du conteneur
        if: always()
        run: |
          docker rm -f vsn-server-image 2>/dev/null || true
          docker volume rm vsn-ci-jar 2>/dev/null || true

      - name: Rapports Trivy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-reports
          path: |
            ${{ runner.temp }}/trivy-fs.txt
            ${{ runner.temp }}/trivy-image.txt
          retention-days: 7
          if-no-files-found: ignore
