# Le gate de merge, en CI (#491).
#
# AVANT : le gate n'existait que comme convention locale (`agents/ship.sh`
# appelle `make check`), sans aucune CI. Une PR fusionnée par un autre chemin
# (push direct, merge MCP, humain) n'était vérifiée par RIEN — la PR #481 a
# ainsi cassé la compilation Kotlin de `main` (#483).
#
# Ce workflow joue le MÊME gate que le poste : `make check` (9 étapes, dont
# la compilation Kotlin et Android Lint Gradle (même invocation — #627), la
# parité TS <-> Kotlin exécutée, les scans d'architecture et l'audit des
# dépendances). Pas de version « light » : un
# gate qui ne rejoue pas les étapes locales ne prouve rien.
#
# Aucun secret : le dépôt est public, le job ne lit ni `.env`, ni token, ni
# corpus Pronote (celui-ci est gitignoré : la parité sur données réelles est
# donc SKIPpée, bruyamment, comme sur le poste).
name: gate

on:
  push:
    branches: [main]
  pull_request:

# Un seul job : les étapes du gate sont déjà parallélisées par `check.ts`.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Code
        uses: actions/checkout@v4

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # LE CACHE GRADLE. Sans lui, chaque run retélécharge la distribution
      # Gradle (165 Mo), les dépendances AGP/Kotlin/AndroidX (213 Mo) et
      # REFAIT les transformations AAR (353 Mo) : 139 s à froid contre 28 s
      # avec le cache (mesuré, même machine, daemon froid).
      #
      # `caches/build-cache-1` est VOLONTAIREMENT ABSENT : ce cache servirait
      # la compilation Kotlin au lieu de la faire TOURNER — le gate compile,
      # il ne rejoue pas un cache. C'est la seule vérification du gate qui
      # résout les symboles : la garder réelle vaut 15 s.
      #
      # PAS de `restore-keys` : un jeu de transformations plus ancien que les
      # jars de plugins rend la construction `--offline` ILLISIBLE (l'analyse
      # d'instrumentation ne se désérialise plus). La clé est datée des
      # versions : un changement de version la casse et repart de zéro.
      #
      # `continue-on-error` : un cache est une OPTIMISATION, jamais une
      # condition de verdeur. Une panne du service de cache ne doit pas
      # rougir une PR sans rapport avec son code — au pire, le run est lent.
      - name: Cache Gradle
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/9.8.1
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'android/build.gradle.kts', 'android/settings.gradle.kts', 'android/*/build.gradle.kts') }}

      # SDK Android : même version que `compileSdk`/`buildToolsVersion` du
      # module app (`android/app/build.gradle.kts`). Installation DIRECTE des
      # archives versionnées (pas d'action tierce dans le chemin du gate :
      # `android-actions/setup-android` a rendu `failure` sur la première CI,
      # #495) — c'est exactement la disposition qui fait passer le gate sur le
      # poste.
      - name: SDK Android
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          base=https://dl.google.com/android/repository
          mkdir -p "$sdk/platforms" "$sdk/build-tools" "$RUNNER_TEMP/dl"
          curl -sSfL -o "$RUNNER_TEMP/dl/platform.zip" "$base/platform-37.0_r02.zip"
          curl -sSfL -o "$RUNNER_TEMP/dl/build-tools.zip" "$base/build-tools_r36_linux.zip"
          curl -sSfL -o "$RUNNER_TEMP/dl/platform-tools.zip" "$base/platform-tools_r37.0.1-linux.zip"
          # Chaque archive contient UN dossier de premier niveau : on l'extrait
          # dans un dossier temporaire, puis on RENOMME ce dossier à
          # l'emplacement que Gradle attend (le nom interne du build-tools
          # n'est pas son numéro de version : d'où le renommage explicite).
          unzip -q "$RUNNER_TEMP/dl/platform.zip" -d "$RUNNER_TEMP/dl/x-platform"
          top=$(ls "$RUNNER_TEMP/dl/x-platform")
          mv "$RUNNER_TEMP/dl/x-platform/$top" "$sdk/platforms/android-37.0"
          unzip -q "$RUNNER_TEMP/dl/build-tools.zip" -d "$RUNNER_TEMP/dl/x-build-tools"
          top=$(ls "$RUNNER_TEMP/dl/x-build-tools")
          mv "$RUNNER_TEMP/dl/x-build-tools/$top" "$sdk/build-tools/36.0.0"
          unzip -q "$RUNNER_TEMP/dl/platform-tools.zip" -d "$RUNNER_TEMP/dl/x-platform-tools"
          top=$(ls "$RUNNER_TEMP/dl/x-platform-tools")
          mv "$RUNNER_TEMP/dl/x-platform-tools/$top" "$sdk/platform-tools"
          # Licences acceptées (empreintes publiques) : sans elles, Gradle
          # refuse le SDK.
          mkdir -p "$sdk/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' > "$sdk/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$sdk/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          ls "$sdk/platforms" "$sdk/build-tools"

      - name: Dépendances
        run: bun install --frozen-lockfile

      # La parité TS <-> Kotlin compile et EXÉCUTE le port Kotlin : sans
      # `kotlinc` + `java`, toute la suite saute et le gate est vert sans une
      # ligne de production Kotlin exécutée. La version suit le catalogue
      # (`android/gradle/libs.versions.toml`).
      #
      # LE DOSSIER EST `kotlinc/`, PAS `kotlin-compiler-<version>/` (#513).
      # L'archive de JetBrains contient UN dossier de premier niveau nommé
      # `kotlinc` : l'ancien chemin n'a JAMAIS existé, donc le compilateur
      # téléchargé n'était JAMAIS utilisé — c'est celui de l'image du runner
      # qui compilait la parité (et l'image en fournit un, dans la MÊME
      # version). Le téléchargement coûtait 9-17 s pour rien, et le cache ne
      # pouvait pas se sauver : `actions/cache` avale l'erreur de
      # sauvegarde, l'étape post reste verte, l'entrée est simplement ABSENTE.
      #
      # Ici le chemin est le BON, la version est ÉPINGLÉE (celle que la parité
      # compile, pas celle de l'image) et le cache porte sur un dossier qui
      # EXISTE. Un binaire corrompu se répare au lieu de faire échouer le gate.
      - name: Cache compilateur Kotlin
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: node_modules/.cache/kotlinc-2.4.21
          key: kotlinc-2.4.21-${{ runner.os }}

      - name: Compilateur Kotlin
        run: |
          set -euo pipefail
          version=2.4.21
          root="$GITHUB_WORKSPACE/node_modules/.cache/kotlinc-${version}"
          home="$root/kotlinc"
          # Un cache CORROMPU se RÉPARE : on vérifie le BINAIRE, pas sa
          # présence. Un `kotlinc` cassé doit être re-téléchargé, pas faire
          # échouer le gate.
          if ! "$home/bin/kotlinc" -version >/dev/null 2>&1; then
            rm -rf "$root"
            mkdir -p "$root"
            curl -sSfL -o /tmp/kotlin.zip \
              "https://github.com/JetBrains/kotlin/releases/download/v${version}/kotlin-compiler-${version}.zip"
            unzip -q /tmp/kotlin.zip -d "$root"
          fi
          # Le binaire ÉCRIT passe AVANT celui de l'image : c'est la version
          # ÉPINGLÉE que la parité doit compiler.
          export PATH="$home/bin:$PATH"
          echo "$home/bin" >> "$GITHUB_PATH"
          if [ "$(command -v kotlinc)" != "$home/bin/kotlinc" ]; then
            echo "kotlinc hors du chemin épinglé : $(command -v kotlinc)" >&2
            exit 1
          fi
          kotlinc -version

      # LE CACHE DU JAR DE PARITÉ (6,5 Mo). Le harnais compile le port Kotlin
      # dans `node_modules/.cache/kotlin-parity/<empreinte>/parity.jar` —
      # l'empreinte est le sha256 du CONTENU des sources. La CI met ce jar en
      # cache sous la MÊME empreinte (calcul partagé, une seule source de
      # vérité) : quand les sources Kotlin n'ont pas bougé, la compilation
      # (43,6 s) est reprise du cache au lieu d'être refaite.
      #
      # CE QUE ÇA NE CHANGE PAS. Les tests exécutent TOUJOURS le Kotlin
      # compilé et le comparent à la référence TS — seul le RECOMPILAGE est
      # réutilisé, et seulement pour des sources IDENTIQUES.
      - name: Empreinte du port Kotlin
        id: port-kotlin
        run: |
          set -euo pipefail
          digest=$(bun run agents/runtime/parity-digest.ts | tail -1)
          # Une empreinte vide ou malformée produirait une clé de cache
          # silencieusement mauvaise : mieux vaut un ÉCHEC bruyant.
          if ! [[ "$digest" =~ ^[0-9a-f]{16}$ ]]; then
            echo "empreinte du port Kotlin INVALIDE : « $digest »" >&2
            exit 1
          fi
          echo "empreinte=${digest}" >> "$GITHUB_OUTPUT"

      - name: Cache du jar de parité
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: node_modules/.cache/kotlin-parity
          key: kotlin-parity-${{ steps.port-kotlin.outputs.empreinte }}

      - name: Gate
        run: make check
