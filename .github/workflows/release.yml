# Publie une release sur tag `v*` : build réutilisé, signature réelle, checksums.
# `vX.Y.Z` publie une release finale ; `vX.Y.Z-beta.N` une pré-release GitHub,
# avec les mêmes gates (signature, SHA-256, source) et sans jamais toucher « Latest ».
#
# `release-artifact.yml` construit et vérifie une release avec une clé éphémère.
# Ici la signature PUBLIQUE est refaite avec la clé de l'environnement protégé
# `release` : le build n'est pas dupliqué, et un secret absent fait échouer le
# job avant toute publication (aucun repli debug).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Code (tag exact)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Version du tag
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error title=Dispatch hors tag::un dry-run doit viser le tag, pas la branche $GITHUB_REF_NAME."
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            v*) ;;
            *)
              echo "::error title=Tag invalide::« $tag » : attendu vX.Y.Z ou vX.Y.Z-beta.N."
              exit 1
              ;;
          esac
          prerelease=false
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            prerelease=true
          elif [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Tag invalide::« $tag » : attendu vX.Y.Z ou vX.Y.Z-beta.N."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error title=Tag déplacé::HEAD ne correspond plus au SHA du run $GITHUB_SHA."
            exit 1
          fi
          read -r version code < <(bun agents/runtime/android-version.ts)
          if [ "$version" != "${tag#v}" ]; then
            echo "::error title=Version incohérente::tag $tag, version calculée $version (tags multiples sur HEAD ?)."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "code=$code"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # Le workflow réutilisé checkout le ref de l'appelant : sur un tag, c'est le
  # tag exact, sans recopier Gradle ni la vérification de l'artefact.
  build:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/release-artifact.yml

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.code }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Code (tag exact)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag exact
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error title=Tag déplacé::HEAD ne correspond plus au SHA du run $GITHUB_SHA."
            exit 1
          fi
          if ! git tag --points-at HEAD | grep -Fxq "$TAG"; then
            echo "::error title=Tag absent::« $TAG » ne pointe pas sur HEAD."
            exit 1
          fi

      - name: JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$sdk" ] || { echo "ANDROID_SDK_ROOT absent" >&2; exit 1; }
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          [ -x "$sdkmanager" ] || { echo "sdkmanager absent" >&2; exit 1; }
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install "build-tools;36.0.0" "platform-tools"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Artefact release
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-apk
          path: release-apk

      # Les secrets sont lus ICI et jamais recopiés dans un log. Un seul vide
      # suffit à arrêter : le build sans clé réelle ne doit pas devenir une release.
      - name: Secrets de signature
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Secret release absent::Le secret $name de l'environnement « release » est vide. Signature réelle impossible, aucun repli debug."
              exit 1
            fi
          done
          echo "::add-mask::$RELEASE_STORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_PASSWORD"
          echo "::add-mask::$RELEASE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          [ -s "$RUNNER_TEMP/release.jks" ] || {
            echo "::error title=Keystore vide::RELEASE_KEYSTORE_BASE64 ne décode pas un fichier non vide."
            exit 1
          }

      - name: Signature réelle et SHA-256
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk_in="$(find release-apk -type f -name app-release.apk -print -quit)"
          mapping_in="$(find release-apk -type f -name mapping.txt -print -quit)"
          seeds_in="$(find release-apk -type f -name seeds.txt -print -quit)"
          for fichier in "$apk_in" "$mapping_in" "$seeds_in"; do
            [ -s "$fichier" ] || {
              echo "::error title=Artefact release incomplet::APK, mapping ou seeds absent."
              exit 1
            }
          done
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(ls -1 "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          [ -x "$apksigner" ] || {
            echo "::error title=apksigner absent::Aucun build-tools dans $sdk."
            exit 1
          }
          mkdir -p dist
          out="dist/veryslopnynotes-$VERSION.apk"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --alignment-preserved true \
            --out "$out" "$apk_in"
          "$apksigner" verify --print-certs "$out" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error title=APK signé debug::certificat debug refusé pour une release."
            exit 1
          fi
          norm() { tr -d ':' | tr '[:upper:]' '[:lower:]'; }
          signataire="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -1 | norm)"
          attendue="$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -alias "$RELEASE_KEY_ALIAS" \
            -storepass:env RELEASE_STORE_PASSWORD | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | norm)"
          if [ -z "$signataire" ] || [ "$signataire" != "$attendue" ]; then
            echo "::error title=Signature inattendue::certificat « ${signataire:-absent} », attendu « ${attendue:-absent} »."
            exit 1
          fi
          cp "$mapping_in" dist/mapping.txt
          cp "$seeds_in" dist/seeds.txt
          git archive --format=tar.gz --prefix="veryslopnynotes-$VERSION/" \
            -o "dist/veryslopnynotes-$VERSION-source.tar.gz" "$TAG"
          (
            cd dist
            sha256sum "veryslopnynotes-$VERSION.apk" "veryslopnynotes-$VERSION-source.tar.gz" mapping.txt seeds.txt > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Artefacts signés
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Notes et GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/release-notes.md"
          {
            if [ "$PRERELEASE" = "true" ]; then
              printf '> Pré-release `%s` : canal bêta, pas une version stable.\n\n' "$VERSION"
            fi
            printf '## Notes\n\nVoir les commits de cette version.\n\n'
            printf '## Vérification\n\n```\n'
            cat dist/SHA256SUMS
            printf '```\n\nInstaller après téléchargement : `sha256sum -c SHA256SUMS`.\n\n'
            printf '## Source (GPL-3.0-only)\n\n'
            printf -- '- Tag exact : %s/%s/tree/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG"
            printf -- '- Archive : %s/%s/archive/refs/tags/%s.tar.gz\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG"
            printf -- '- Archive jointe : `veryslopnynotes-%s-source.tar.gz`\n' "$VERSION"
          } > "$body"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            {
              echo "## Dry-run"
              echo
              echo "Tag \`$TAG\`, version \`$VERSION\` (\`$VERSION_CODE\`), pré-release : \`$PRERELEASE\`. Aucune GitHub Release publiée."
              echo
              cat "$body"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag "${flags[@]}" \
            --title "Very Slop Notes $VERSION" --notes-file "$body"
          {
            echo "## Release publiée"
            echo
            echo "Tag \`$TAG\`, version \`$VERSION\` (\`$VERSION_CODE\`), pré-release : \`$PRERELEASE\`."
            echo
            cat dist/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
