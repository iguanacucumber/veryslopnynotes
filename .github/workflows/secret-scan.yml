# CI-07 : scan de l'HISTORIQUE complet, pas seulement de l'arbre courant.
#
# `make lint` (check-secrets.ts) lit les fichiers trackés : un secret retiré
# par un commit ultérieur reste dans l'historique, lisible par quiconque clone
# le dépôt. Ce job rejoue donc TOUS les commits avec gitleaks, sur chaque PR
# et sur `main`, et échoue au premier secret trouvé.
#
# Binaire épinglé + empreinte SHA-256 : pas d'action tierce qui changerait de
# version sous nos pieds, et pas de `GITLEAKS_LICENSE` (aucun secret). Le
# rapport SARIF part en artefact 7 jours, y compris en échec.
#
# La configuration `.gitleaks.toml` étend le jeu par défaut et n'allowliste
# que des valeurs de test EXACTES (`tests/`, documentation Playwright) : une
# nouvelle valeur dans ces fichiers rougit toujours.

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : le scan lit le dépôt, il n'écrit rien sur GitHub.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `fetch-depth: 0` est la condition du scan : sans lui, le clone est
      # superficiel et gitleaks ne voit qu'un ou deux commits.
      - name: Code (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks épinglé
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          # Un binaire substitué deviendrait l'outil qui rend le verdict :
          # l'empreinte est comparée AVANT l'extraction.
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/$archive" |
            sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      # `git . --log-opts=--all` parcourt toutes les branches et tous les tags,
      # pas seulement le commit de checkout. `--redact` garde le secret hors
      # des logs ; `--exit-code 1` (défaut, posé explicitement) fait échouer
      # le job dès une trouvaille : aucun vert fabriqué.
      - name: Scan de l'historique complet
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --log-opts=--all \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif"

      - name: Rapport gitleaks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          retention-days: 7
          if-no-files-found: ignore
